name: Rebuild map data

# Runs whenever a column record changes (from the admin page or a normal commit)
# and regenerates data/columns.geojson and data/records.json.
on:
  push:
    branches: [main]
    paths:
      - 'data/columns/**'
      - 'data/kcc.json'
      - 'scripts/build_geojson.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-map-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 scripts/build_geojson.py
      - name: Commit if changed
        run: |
          git config user.name "map-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/columns.geojson data/records.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild map data"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
