name: Rebuild map data

# Runs whenever a column record changes (from the admin page or a normal commit)
# and regenerates data/columns.geojson and data/records.json.
# If main moves while this runs (e.g. several quick admin saves), it starts again
# from the latest main, so the generated files never conflict.
on:
  push:
    branches: [main]
    paths:
      - 'data/columns/**'
      - 'data/kcc.json'
      - 'scripts/build_geojson.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-map-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and commit
        run: |
          git config user.name "map-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/build_geojson.py
            git add data/columns.geojson data/records.json
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Rebuild map data"
            if git push -q origin HEAD:main; then echo "Pushed"; exit 0; fi
            echo "main moved while building - retrying from the latest version"
            sleep $((i * 4))
          done
          exit 1
